project:
  name: MARS-EVIDENCE
  seed: 42

paths:
  raw_images: data/raw/mastcam_z/pilot
  metadata: data/metadata/mastcam_z_pilot.csv
  figures: outputs/figures
  embeddings: outputs/embeddings

model:
  name: facebook/dinov2-small
  image_size: 224
  batch_size: 8

umap:
  n_neighbors: 15
  min_dist: 0.1
  n_components: 2
  metric: cosine

hdbscan:
  min_cluster_size: 5
  min_samples: 3

anomaly:
  method: knn_distance
  neighbors: 5
  top_k: 20
